<!DOCTYPE html>
<html lang="zh-cn" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remote Clipboard — Eltria</title>
  <meta name="description" content="Share text between devices in real-time with a room code.">
  <script src="/assets/js/theme.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="/assets/css/global.css">
</head>
<body class="bg-white dark:bg-gray-950 text-gray-800 dark:text-gray-200 antialiased">

  <script type="module">
    import { initNav } from '/assets/js/nav.js';
    initNav();
  </script>

  <div class="max-w-3xl mx-auto px-6 py-16">
    <div class="mb-6">
      <a href="/tools/" class="text-xs text-gray-400 hover:text-blue-500 no-underline">← Tools</a>
    </div>
    <h1 class="text-2xl font-bold mb-2">Remote Clipboard</h1>
    <p class="text-xs text-gray-400 mb-8">Share text between devices. Enter the same room code on both devices.</p>

    <!-- Room Code -->
    <div class="flex flex-col sm:flex-row gap-3 mb-8">
      <div class="flex-1">
        <label class="block text-xs font-medium text-gray-400 mb-2">Room Code</label>
        <div class="flex gap-2">
          <input id="room-code" type="text" maxlength="6" class="flex-1 px-4 py-3 text-center text-2xl font-mono font-bold tracking-[0.3em] uppercase bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500" placeholder="------" spellcheck="false" autocomplete="off">
          <button id="btn-generate" class="px-4 py-3 text-xs font-medium bg-blue-600 text-white rounded-xl hover:bg-blue-700 transition-colors whitespace-nowrap">New Room</button>
        </div>
      </div>
    </div>

    <!-- Status -->
    <div id="status" class="mb-4 flex items-center gap-2">
      <span id="status-dot" class="w-2 h-2 rounded-full bg-gray-300"></span>
      <span id="status-text" class="text-xs text-gray-400">Enter a room code or generate a new one</span>
    </div>

    <!-- Content -->
    <div class="mb-4">
      <div class="flex items-center justify-between mb-2">
        <label class="text-xs font-medium text-gray-400">Shared Content</label>
        <span id="last-update" class="text-xs text-gray-400"></span>
      </div>
      <textarea id="content" class="tool-textarea w-full h-64 p-4 text-sm bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500" placeholder="Type or paste content here — it syncs in real-time..." spellcheck="false" disabled></textarea>
    </div>

    <!-- Actions -->
    <div class="flex flex-wrap gap-2">
      <button id="btn-copy" disabled class="px-4 py-2 text-xs font-medium bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors disabled:opacity-40">Copy to Clipboard</button>
      <button id="btn-clear" disabled class="px-4 py-2 text-xs font-medium bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors disabled:opacity-40">Clear</button>
      <button id="btn-share" disabled class="px-4 py-2 text-xs font-medium bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors disabled:opacity-40 ml-auto">Share Link</button>
    </div>

    <!-- Info -->
    <div class="mt-12 pt-8 border-t border-gray-100 dark:border-gray-800 text-xs text-gray-400 dark:text-gray-600 space-y-1">
      <p>Data is stored temporarily on Firebase Realtime Database. Max 10KB per room.</p>
      <p>Rooms are ephemeral — do not use for sensitive data.</p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, off } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAwiNm9a6NwPjSbEryoZbCHoMuQC6iqh3U",
      authDomain: "copy-paste-518ae.firebaseapp.com",
      databaseURL: "https://copy-paste-518ae-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "copy-paste-518ae",
      storageBucket: "copy-paste-518ae.firebasestorage.app",
      messagingSenderId: "382664513416",
      appId: "1:382664513416:web:365d3feeb7800158168c3d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const roomCodeEl = document.getElementById('room-code');
    const contentEl = document.getElementById('content');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const lastUpdate = document.getElementById('last-update');
    const btnGenerate = document.getElementById('btn-generate');
    const btnCopy = document.getElementById('btn-copy');
    const btnClear = document.getElementById('btn-clear');
    const btnShare = document.getElementById('btn-share');

    let currentRoom = null;
    let currentRef = null;
    let isRemoteUpdate = false;
    let writeTimer = null;

    function generateCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no ambiguous chars
      let code = '';
      for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
      return code;
    }

    function setStatus(state, msg) {
      const colors = { connected: 'bg-green-500', disconnected: 'bg-gray-300', error: 'bg-red-500' };
      statusDot.className = `w-2 h-2 rounded-full ${colors[state] || 'bg-gray-300'}`;
      statusText.textContent = msg;
    }

    function joinRoom(code) {
      code = code.toUpperCase().trim();
      if (code.length !== 6) return;

      // Leave previous room
      if (currentRef) off(currentRef);

      currentRoom = code;
      roomCodeEl.value = code;
      contentEl.disabled = false;
      btnCopy.disabled = false;
      btnClear.disabled = false;
      btnShare.disabled = false;

      setStatus('connected', `Connected to room ${code}`);

      // Listen for changes
      currentRef = ref(db, `rooms/${code}`);
      onValue(currentRef, (snapshot) => {
        const data = snapshot.val();
        if (data && data.content !== undefined) {
          isRemoteUpdate = true;
          contentEl.value = data.content;
          isRemoteUpdate = false;
          if (data.ts) {
            const d = new Date(data.ts);
            lastUpdate.textContent = `Last sync: ${d.toLocaleTimeString()}`;
          }
        }
      }, (error) => {
        setStatus('error', `Error: ${error.message}`);
      });

      // Save to URL hash
      window.location.hash = code;
      localStorage.setItem('eltria-clipboard-room', code);
    }

    function writeContent(text) {
      if (!currentRoom) return;
      const roomRef = ref(db, `rooms/${currentRoom}`);
      set(roomRef, {
        content: text,
        ts: Date.now()
      });
    }

    // Content input — debounced write
    contentEl.addEventListener('input', () => {
      if (isRemoteUpdate) return;
      clearTimeout(writeTimer);
      writeTimer = setTimeout(() => {
        writeContent(contentEl.value);
      }, 300);
    });

    // Generate new room
    btnGenerate.addEventListener('click', () => {
      const code = generateCode();
      joinRoom(code);
    });

    // Room code input — join on 6 chars or Enter
    roomCodeEl.addEventListener('input', () => {
      const code = roomCodeEl.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      roomCodeEl.value = code;
      if (code.length === 6) joinRoom(code);
    });

    roomCodeEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const code = roomCodeEl.value.trim();
        if (code.length === 6) joinRoom(code);
      }
    });

    // Copy
    btnCopy.addEventListener('click', () => {
      navigator.clipboard.writeText(contentEl.value).then(() => {
        btnCopy.textContent = 'Copied!';
        setTimeout(() => btnCopy.textContent = 'Copy to Clipboard', 1500);
      });
    });

    // Clear
    btnClear.addEventListener('click', () => {
      contentEl.value = '';
      writeContent('');
    });

    // Share link
    btnShare.addEventListener('click', () => {
      const url = `${window.location.origin}${window.location.pathname}#${currentRoom}`;
      navigator.clipboard.writeText(url).then(() => {
        btnShare.textContent = 'Link Copied!';
        setTimeout(() => btnShare.textContent = 'Share Link', 1500);
      });
    });

    // Auto-join from URL hash or localStorage
    const hashCode = window.location.hash.slice(1);
    const savedCode = localStorage.getItem('eltria-clipboard-room');
    if (hashCode && hashCode.length === 6) {
      joinRoom(hashCode);
    } else if (savedCode && savedCode.length === 6) {
      joinRoom(savedCode);
    }
  </script>
</body>
</html>
