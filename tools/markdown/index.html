<!DOCTYPE html>
<html lang="zh-cn" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Preview — Eltria</title>
  <meta name="description" content="Live Markdown preview with Mermaid diagrams, KaTeX math, syntax highlighting, and GFM support.">
  <script src="/assets/js/theme.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="/assets/css/global.css">
  <!-- Marked.js -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Highlight.js -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <!-- Mermaid -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <style>
    .preview-content { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; line-height: 1.8; }
    .preview-content h1 { font-size: 2em; font-weight: 700; margin: 1em 0 0.5em; padding-bottom: 0.3em; border-bottom: 1px solid var(--tw-prose-hr, #e5e7eb); }
    .preview-content h2 { font-size: 1.5em; font-weight: 600; margin: 1em 0 0.5em; padding-bottom: 0.2em; border-bottom: 1px solid var(--tw-prose-hr, #e5e7eb); }
    .preview-content h3 { font-size: 1.25em; font-weight: 600; margin: 0.8em 0 0.4em; }
    .preview-content p { margin: 0.6em 0; }
    .preview-content ul, .preview-content ol { margin: 0.5em 0; padding-left: 2em; }
    .preview-content li { margin: 0.2em 0; }
    .preview-content code { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.875em; padding: 0.15em 0.4em; border-radius: 4px; background: rgba(127,127,127,0.12); }
    .preview-content pre { margin: 1em 0; border-radius: 8px; overflow: auto; }
    .preview-content pre code { display: block; padding: 1em; background: #f6f8fa; font-size: 0.85em; line-height: 1.6; }
    .dark .preview-content pre code { background: #161b22; }
    .preview-content blockquote { margin: 0.8em 0; padding: 0.5em 1em; border-left: 4px solid #3b82f6; background: rgba(59,130,246,0.06); border-radius: 0 6px 6px 0; }
    .preview-content table { border-collapse: collapse; margin: 1em 0; width: 100%; }
    .preview-content th, .preview-content td { border: 1px solid #d1d5db; padding: 0.5em 0.75em; text-align: left; }
    .dark .preview-content th, .dark .preview-content td { border-color: #374151; }
    .preview-content th { background: rgba(127,127,127,0.08); font-weight: 600; }
    .preview-content img { max-width: 100%; border-radius: 6px; }
    .preview-content a { color: #3b82f6; text-decoration: underline; }
    .preview-content hr { margin: 1.5em 0; border: none; border-top: 1px solid #e5e7eb; }
    .dark .preview-content hr { border-color: #374151; }
    .preview-content .task-list-item { list-style: none; margin-left: -1.5em; }
    .preview-content .task-list-item input { margin-right: 0.5em; }
    .mermaid { margin: 1em 0; text-align: center; }
    .katex-display { margin: 1em 0; overflow-x: auto; }
  </style>
</head>
<body class="bg-white dark:bg-gray-950 text-gray-800 dark:text-gray-200 antialiased">

  <script type="module">
    import { initNav } from '/assets/js/nav.js';
    initNav();
  </script>

  <div class="max-w-7xl mx-auto px-6 py-16">
    <div class="mb-6 flex items-center justify-between">
      <a href="/tools/" class="text-xs text-gray-400 hover:text-blue-500 no-underline">← Tools</a>
      <div class="flex gap-2">
        <button onclick="loadSample()" class="px-3 py-1.5 text-xs font-medium bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">Load Sample</button>
        <button onclick="copyHTML()" class="px-3 py-1.5 text-xs font-medium bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">Copy HTML</button>
      </div>
    </div>
    <h1 class="text-2xl font-bold mb-1">Markdown Preview</h1>
    <p class="text-xs text-gray-400 mb-6">GFM + Mermaid diagrams + KaTeX math + syntax highlighting</p>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4" style="align-items:start">
      <!-- Editor -->
      <div class="lg:sticky lg:top-20">
        <label class="block text-xs font-medium text-gray-400 mb-2">Markdown</label>
        <textarea id="editor" class="tool-textarea w-full p-4 text-sm bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500" style="height:calc(100vh - 14rem)" placeholder="Write markdown here..." spellcheck="false"></textarea>
      </div>
      <!-- Preview -->
      <div>
        <label class="block text-xs font-medium text-gray-400 mb-2">Preview</label>
        <div id="preview" class="preview-content w-full p-6 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl overflow-auto" style="min-height:calc(100vh - 14rem)"></div>
      </div>
    </div>
  </div>

  <script>
    // Init mermaid
    mermaid.initialize({
      startOnLoad: false,
      theme: document.documentElement.classList.contains('dark') ? 'dark' : 'default',
      securityLevel: 'loose',
    });

    const editor = document.getElementById('editor');
    const preview = document.getElementById('preview');

    // Configure marked
    marked.setOptions({
      gfm: true,
      breaks: true,
      highlight: function(code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          return hljs.highlight(code, { language: lang }).value;
        }
        return hljs.highlightAuto(code).value;
      },
    });

    let renderTimer;
    editor.addEventListener('input', () => {
      clearTimeout(renderTimer);
      renderTimer = setTimeout(render, 150);
    });

    async function render() {
      let md = editor.value;

      // Extract mermaid blocks before marked processes them
      const mermaidBlocks = [];
      md = md.replace(/```mermaid\n([\s\S]*?)```/g, (_, code) => {
        const id = `mermaid-${mermaidBlocks.length}`;
        mermaidBlocks.push({ id, code: code.trim() });
        return `<div class="mermaid-placeholder" data-id="${id}"></div>`;
      });

      // Extract KaTeX blocks
      // Display math: $$ ... $$
      md = md.replace(/\$\$([\s\S]*?)\$\$/g, (_, tex) => {
        try {
          return `<div class="katex-display">${katex.renderToString(tex.trim(), { displayMode: true, throwOnError: false })}</div>`;
        } catch (e) {
          return `<div class="text-red-500 text-xs">KaTeX error: ${e.message}</div>`;
        }
      });

      // Inline math: $ ... $ (not greedy, not matching $$ )
      md = md.replace(/(?<!\$)\$(?!\$)([^\n$]+?)\$(?!\$)/g, (_, tex) => {
        try {
          return katex.renderToString(tex.trim(), { displayMode: false, throwOnError: false });
        } catch (e) {
          return `<span class="text-red-500 text-xs">KaTeX error</span>`;
        }
      });

      let html = marked.parse(md);

      // GFM task list
      html = html.replace(/<li>\[ \]/g, '<li class="task-list-item"><input type="checkbox" disabled>');
      html = html.replace(/<li>\[x\]/gi, '<li class="task-list-item"><input type="checkbox" checked disabled>');

      preview.innerHTML = html;

      // Render mermaid
      for (const block of mermaidBlocks) {
        const placeholder = preview.querySelector(`[data-id="${block.id}"]`);
        if (placeholder) {
          try {
            const { svg } = await mermaid.render(block.id, block.code);
            placeholder.innerHTML = `<div class="mermaid">${svg}</div>`;
          } catch (e) {
            placeholder.innerHTML = `<div class="text-red-500 text-xs p-2 bg-red-50 dark:bg-red-950/30 rounded">Mermaid error: ${e.message}</div>`;
          }
        }
      }
    }

    function copyHTML() {
      navigator.clipboard.writeText(preview.innerHTML);
    }

    function loadSample() {
      editor.value = `# Markdown Preview Demo

## Text Formatting

**Bold**, *italic*, ~~strikethrough~~, \`inline code\`, [links](https://example.com)

## Code Block

\`\`\`javascript
function fibonacci(n) {
  if (n <= 1) return n;
  return fibonacci(n - 1) + fibonacci(n - 2);
}
\`\`\`

## Table

| Feature | Status | Notes |
|---------|--------|-------|
| GFM | Done | Tables, task lists |
| Mermaid | Done | Flowcharts, sequence |
| KaTeX | Done | Math formulas |

## Task List

- [x] Markdown parsing
- [x] Syntax highlighting
- [x] Mermaid diagrams
- [ ] Export to PDF

## Math (KaTeX)

Inline: $E = mc^2$

Display:

$$\\int_{-\\infty}^{\\infty} e^{-x^2} dx = \\sqrt{\\pi}$$

## Mermaid Diagram

\`\`\`mermaid
graph LR
  A[Markdown] --> B[marked.js]
  B --> C[HTML]
  B --> D[Mermaid]
  B --> E[KaTeX]
  D --> C
  E --> C
  C --> F[Preview]
\`\`\`

## Sequence Diagram

\`\`\`mermaid
sequenceDiagram
  participant U as User
  participant E as Editor
  participant P as Preview
  U->>E: Type markdown
  E->>P: Render HTML
  P-->>U: Live preview
\`\`\`

> Blockquotes work too. This is a **rich** preview experience.
`;
      render();
    }

    // Initial render
    render();
  </script>
</body>
</html>
