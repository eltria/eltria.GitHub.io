<!DOCTYPE html>
<html lang="zh-cn" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base64 Encoder/Decoder — Eltria</title>
  <meta name="description" content="Encode and decode Base64 strings online.">
  <script src="/assets/js/theme.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="/assets/css/global.css">
</head>
<body class="bg-white dark:bg-gray-950 text-gray-800 dark:text-gray-200 antialiased">

  <script type="module">
    import { initNav } from '/assets/js/nav.js';
    initNav();
  </script>

  <div class="max-w-3xl mx-auto px-6 py-16">
    <div class="mb-6">
      <a href="/tools/" class="text-xs text-gray-400 hover:text-blue-500 no-underline">← Tools</a>
    </div>
    <h1 class="text-2xl font-bold mb-6">Base64 Encoder / Decoder</h1>

    <div class="space-y-6">
      <!-- Input -->
      <div>
        <label class="block text-xs font-medium text-gray-400 mb-2">Input</label>
        <textarea id="input" class="tool-textarea w-full h-40 p-4 text-sm bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500" placeholder="Enter text or Base64 string..." spellcheck="false"></textarea>
      </div>

      <!-- Buttons -->
      <div class="flex gap-2">
        <button onclick="encode()" class="px-4 py-2 text-xs font-medium bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">Encode →</button>
        <button onclick="decode()" class="px-4 py-2 text-xs font-medium bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">← Decode</button>
        <button onclick="copyResult()" class="px-4 py-2 text-xs font-medium bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors ml-auto">Copy</button>
      </div>

      <!-- Output -->
      <div>
        <label class="block text-xs font-medium text-gray-400 mb-2">Output</label>
        <textarea id="output" class="tool-textarea w-full h-40 p-4 text-sm bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl focus:outline-none" readonly spellcheck="false"></textarea>
      </div>

      <div id="status" class="text-xs h-5"></div>
    </div>
  </div>

  <script>
    const input = document.getElementById('input');
    const output = document.getElementById('output');
    const status = document.getElementById('status');

    function setStatus(msg, ok) {
      status.className = `text-xs h-5 ${ok ? 'text-green-500' : 'text-red-500'}`;
      status.textContent = msg;
    }

    function encode() {
      try {
        output.value = btoa(unescape(encodeURIComponent(input.value)));
        setStatus(`Encoded — ${output.value.length} chars`, true);
      } catch (e) {
        setStatus(`Error: ${e.message}`, false);
      }
    }

    function decode() {
      try {
        output.value = decodeURIComponent(escape(atob(input.value.trim())));
        setStatus(`Decoded — ${output.value.length} chars`, true);
      } catch (e) {
        setStatus('Invalid Base64 string', false);
      }
    }

    function copyResult() {
      navigator.clipboard.writeText(output.value).then(() => {
        status.className = 'text-xs h-5 text-gray-400';
        status.textContent = 'Copied!';
      });
    }
  </script>
</body>
</html>
