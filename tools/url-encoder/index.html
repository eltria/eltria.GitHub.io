<!DOCTYPE html>
<html lang="zh-cn" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Encoder/Decoder — Eltria</title>
  <meta name="description" content="Encode and decode URL components online.">
  <script src="/assets/js/theme.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="/assets/css/global.css">
</head>
<body class="bg-white dark:bg-gray-950 text-gray-800 dark:text-gray-200 antialiased">

  <script type="module">
    import { initNav } from '/assets/js/nav.js';
    initNav();
  </script>

  <div class="max-w-3xl mx-auto px-6 py-16">
    <div class="mb-6">
      <a href="/tools/" class="text-xs text-gray-400 hover:text-blue-500 no-underline">← Tools</a>
    </div>
    <h1 class="text-2xl font-bold mb-6">URL Encoder / Decoder</h1>

    <div class="space-y-6">
      <div>
        <label class="block text-xs font-medium text-gray-400 mb-2">Input</label>
        <textarea id="input" class="tool-textarea w-full h-32 p-4 text-sm bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500" placeholder="Enter URL or encoded string..." spellcheck="false"></textarea>
      </div>

      <div class="flex flex-wrap gap-2">
        <button onclick="encodeURL()" class="px-4 py-2 text-xs font-medium bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">Encode →</button>
        <button onclick="decodeURL()" class="px-4 py-2 text-xs font-medium bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">← Decode</button>
        <button onclick="encodeComponent()" class="px-4 py-2 text-xs font-medium bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">encodeURIComponent</button>
        <button onclick="copyResult()" class="px-4 py-2 text-xs font-medium bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors ml-auto">Copy</button>
      </div>

      <div>
        <label class="block text-xs font-medium text-gray-400 mb-2">Output</label>
        <textarea id="output" class="tool-textarea w-full h-32 p-4 text-sm bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl focus:outline-none" readonly spellcheck="false"></textarea>
      </div>

      <!-- URL Parser -->
      <div>
        <button onclick="parseURL()" class="text-xs font-medium text-gray-500 hover:text-blue-500 transition-colors mb-3">Parse URL Components</button>
        <div id="parsed" class="hidden bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl p-4 text-sm font-mono space-y-1"></div>
      </div>

      <div id="status" class="text-xs h-5"></div>
    </div>
  </div>

  <script>
    const input = document.getElementById('input');
    const output = document.getElementById('output');
    const status = document.getElementById('status');

    function setStatus(msg, ok) {
      status.className = `text-xs h-5 ${ok ? 'text-green-500' : 'text-red-500'}`;
      status.textContent = msg;
    }

    function encodeURL() {
      try {
        output.value = encodeURI(input.value);
        setStatus('Encoded with encodeURI', true);
      } catch (e) { setStatus(e.message, false); }
    }

    function decodeURL() {
      try {
        output.value = decodeURIComponent(input.value.trim());
        setStatus('Decoded', true);
      } catch (e) { setStatus(e.message, false); }
    }

    function encodeComponent() {
      output.value = encodeURIComponent(input.value);
      setStatus('Encoded with encodeURIComponent', true);
    }

    function parseURL() {
      const div = document.getElementById('parsed');
      try {
        const url = new URL(input.value.trim());
        const parts = [
          ['protocol', url.protocol],
          ['host', url.host],
          ['pathname', url.pathname],
          ['search', url.search],
          ['hash', url.hash],
        ];
        if (url.searchParams.toString()) {
          url.searchParams.forEach((v, k) => parts.push([`  param: ${k}`, v]));
        }
        div.innerHTML = parts
          .filter(([, v]) => v)
          .map(([k, v]) => `<div><span class="text-gray-400">${k}:</span> <span class="text-blue-600 dark:text-blue-400">${v}</span></div>`)
          .join('');
        div.classList.remove('hidden');
      } catch {
        div.innerHTML = '<span class="text-red-500">Not a valid URL</span>';
        div.classList.remove('hidden');
      }
    }

    function copyResult() {
      navigator.clipboard.writeText(output.value).then(() => {
        status.className = 'text-xs h-5 text-gray-400';
        status.textContent = 'Copied!';
      });
    }
  </script>
</body>
</html>
