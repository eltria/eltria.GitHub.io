<!DOCTYPE html>
<html lang="zh-cn" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pastebin — Eltria</title>
  <meta name="description" content="Share code snippets with syntax highlighting. Powered by Firebase.">
  <script src="/assets/js/theme.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body class="bg-white dark:bg-gray-950 text-gray-800 dark:text-gray-200 antialiased">
  <script type="module">import { initNav } from '/assets/js/nav.js'; initNav();</script>

  <div class="max-w-4xl mx-auto px-6 py-16">
    <div class="mb-6"><a href="/tools/" class="text-xs text-gray-400 hover:text-blue-500 no-underline">← Tools</a></div>
    <h1 class="text-2xl font-bold mb-6">Pastebin</h1>

    <!-- Editor view -->
    <div id="editor-view">
      <div class="flex flex-wrap gap-2 mb-4">
        <select id="language" class="px-3 py-1.5 text-xs bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-lg">
          <option value="">Auto-detect</option>
          <option value="javascript">JavaScript</option>
          <option value="typescript">TypeScript</option>
          <option value="python">Python</option>
          <option value="go">Go</option>
          <option value="java">Java</option>
          <option value="rust">Rust</option>
          <option value="sql">SQL</option>
          <option value="bash">Bash</option>
          <option value="json">JSON</option>
          <option value="yaml">YAML</option>
          <option value="html">HTML</option>
          <option value="css">CSS</option>
          <option value="markdown">Markdown</option>
          <option value="plaintext">Plain Text</option>
        </select>
        <input id="title" type="text" class="flex-1 px-3 py-1.5 text-xs bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-lg" placeholder="Title (optional)">
        <button onclick="sharePaste()" class="px-4 py-1.5 text-xs font-medium bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">Share</button>
      </div>
      <textarea id="code-input" class="tool-textarea w-full h-96 p-4 text-sm bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500" placeholder="Paste your code here..." spellcheck="false"></textarea>
    </div>

    <!-- Read view -->
    <div id="read-view" class="hidden">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h2 id="paste-title" class="text-lg font-semibold"></h2>
          <div id="paste-meta" class="text-xs text-gray-400 mt-1"></div>
        </div>
        <div class="flex gap-2">
          <button onclick="copyCode()" class="px-3 py-1.5 text-xs font-medium bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">Copy</button>
          <button onclick="copyLink()" class="px-3 py-1.5 text-xs font-medium bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">Share Link</button>
          <button onclick="newPaste()" class="px-3 py-1.5 text-xs font-medium bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">New Paste</button>
        </div>
      </div>
      <pre class="rounded-xl border border-gray-200 dark:border-gray-800 overflow-auto"><code id="paste-code" class="p-4 text-sm block"></code></pre>
    </div>

    <div id="status" class="mt-3 text-xs h-5"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

    const app = initializeApp({
      apiKey: "AIzaSyAwiNm9a6NwPjSbEryoZbCHoMuQC6iqh3U",
      authDomain: "copy-paste-518ae.firebaseapp.com",
      databaseURL: "https://copy-paste-518ae-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "copy-paste-518ae",
      storageBucket: "copy-paste-518ae.firebasestorage.app",
      messagingSenderId: "382664513416",
      appId: "1:382664513416:web:365d3feeb7800158168c3d"
    });
    const db = getDatabase(app);

    const statusEl = document.getElementById('status');

    function generateId() {
      const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
      let id = '';
      for (let i = 0; i < 8; i++) id += chars[Math.floor(Math.random() * chars.length)];
      return id;
    }

    // Share
    window.sharePaste = async function() {
      const code = document.getElementById('code-input').value;
      if (!code.trim()) { statusEl.textContent = 'Nothing to share'; return; }

      const id = generateId();
      const data = {
        code,
        title: document.getElementById('title').value || 'Untitled',
        language: document.getElementById('language').value,
        ts: Date.now(),
      };

      try {
        await set(ref(db, `pastes/${id}`), data);
        window.location.hash = id;
        loadPaste(id);
        statusEl.className = 'mt-3 text-xs h-5 text-green-500';
        statusEl.textContent = 'Shared! Link copied.';
        navigator.clipboard.writeText(window.location.href);
      } catch (e) {
        statusEl.className = 'mt-3 text-xs h-5 text-red-500';
        statusEl.textContent = 'Error: ' + e.message;
      }
    };

    // Load
    async function loadPaste(id) {
      try {
        const snapshot = await get(ref(db, `pastes/${id}`));
        if (!snapshot.exists()) {
          statusEl.className = 'mt-3 text-xs h-5 text-red-500';
          statusEl.textContent = 'Paste not found';
          return;
        }
        const data = snapshot.val();
        document.getElementById('editor-view').classList.add('hidden');
        document.getElementById('read-view').classList.remove('hidden');
        document.getElementById('paste-title').textContent = data.title || 'Untitled';
        document.getElementById('paste-meta').textContent = `${data.language || 'auto'} · ${new Date(data.ts).toLocaleString('zh-CN')}`;

        const codeEl = document.getElementById('paste-code');
        codeEl.textContent = data.code;
        codeEl.className = data.language ? `language-${data.language} p-4 text-sm block` : 'p-4 text-sm block';
        hljs.highlightElement(codeEl);

        window._pasteCode = data.code;
      } catch (e) {
        statusEl.className = 'mt-3 text-xs h-5 text-red-500';
        statusEl.textContent = 'Error loading paste';
      }
    }

    window.copyCode = function() {
      navigator.clipboard.writeText(window._pasteCode || '');
      statusEl.className = 'mt-3 text-xs h-5 text-gray-400';
      statusEl.textContent = 'Code copied!';
    };

    window.copyLink = function() {
      navigator.clipboard.writeText(window.location.href);
      statusEl.className = 'mt-3 text-xs h-5 text-gray-400';
      statusEl.textContent = 'Link copied!';
    };

    window.newPaste = function() {
      window.location.hash = '';
      document.getElementById('editor-view').classList.remove('hidden');
      document.getElementById('read-view').classList.add('hidden');
      document.getElementById('code-input').value = '';
      document.getElementById('title').value = '';
    };

    // Check hash on load
    const hash = window.location.hash.slice(1);
    if (hash) loadPaste(hash);
  </script>
</body>
</html>
