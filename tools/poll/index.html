<!DOCTYPE html>
<html lang="zh-cn" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Poll — Eltria</title>
  <meta name="description" content="Create instant polls and share with a link. Real-time results.">
  <script src="/assets/js/theme.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="/assets/css/global.css">
</head>
<body class="bg-white dark:bg-gray-950 text-gray-800 dark:text-gray-200 antialiased">
  <script type="module">import { initNav } from '/assets/js/nav.js'; initNav();</script>

  <div class="max-w-2xl mx-auto px-6 py-16">
    <div class="mb-6"><a href="/tools/" class="text-xs text-gray-400 hover:text-blue-500 no-underline">← Tools</a></div>
    <h1 class="text-2xl font-bold mb-6">Quick Poll</h1>

    <!-- Create view -->
    <div id="create-view">
      <div class="space-y-4 mb-6">
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-2">Question</label>
          <input id="question" type="text" class="w-full px-4 py-3 text-sm bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500" placeholder="What should we use for state management?">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-2">Options</label>
          <div id="options-list" class="space-y-2">
            <input type="text" class="option-input w-full px-4 py-2 text-sm bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-lg" placeholder="Option 1">
            <input type="text" class="option-input w-full px-4 py-2 text-sm bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-lg" placeholder="Option 2">
          </div>
          <button onclick="addOption()" class="mt-2 text-xs text-blue-500 hover:text-blue-600">+ Add option</button>
        </div>
      </div>
      <button onclick="createPoll()" class="w-full px-4 py-3 text-sm font-medium bg-blue-600 text-white rounded-xl hover:bg-blue-700 transition-colors">Create Poll</button>
    </div>

    <!-- Vote/Results view -->
    <div id="poll-view" class="hidden">
      <h2 id="poll-question" class="text-xl font-semibold mb-6"></h2>
      <div id="poll-options" class="space-y-3 mb-6"></div>
      <div class="flex gap-2">
        <button onclick="copyPollLink()" class="px-4 py-2 text-xs font-medium bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">Share Link</button>
        <button onclick="newPoll()" class="px-4 py-2 text-xs font-medium bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">New Poll</button>
      </div>
      <div id="total-votes" class="mt-4 text-xs text-gray-400"></div>
    </div>

    <div id="status" class="mt-3 text-xs h-5"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getDatabase, ref, set, get, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

    const app = initializeApp({
      apiKey: "AIzaSyAwiNm9a6NwPjSbEryoZbCHoMuQC6iqh3U",
      authDomain: "copy-paste-518ae.firebaseapp.com",
      databaseURL: "https://copy-paste-518ae-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "copy-paste-518ae",
      storageBucket: "copy-paste-518ae.firebasestorage.app",
      messagingSenderId: "382664513416",
      appId: "1:382664513416:web:365d3feeb7800158168c3d"
    });
    const db = getDatabase(app);
    const statusEl = document.getElementById('status');

    let currentPollId = null;
    const barColors = ['bg-blue-500', 'bg-purple-500', 'bg-pink-500', 'bg-amber-500', 'bg-green-500', 'bg-red-500', 'bg-cyan-500', 'bg-indigo-500'];

    function generateId() {
      const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
      let id = '';
      for (let i = 0; i < 6; i++) id += chars[Math.floor(Math.random() * chars.length)];
      return id;
    }

    window.addOption = function() {
      const list = document.getElementById('options-list');
      const count = list.children.length + 1;
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'option-input w-full px-4 py-2 text-sm bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-lg';
      input.placeholder = `Option ${count}`;
      list.appendChild(input);
    };

    window.createPoll = async function() {
      const question = document.getElementById('question').value.trim();
      const optionInputs = document.querySelectorAll('.option-input');
      const options = [...optionInputs].map(i => i.value.trim()).filter(Boolean);

      if (!question) { statusEl.textContent = 'Please enter a question'; return; }
      if (options.length < 2) { statusEl.textContent = 'Need at least 2 options'; return; }

      const id = generateId();
      const votes = {};
      options.forEach((_, i) => votes[i] = 0);

      await set(ref(db, `polls/${id}`), { question, options, votes, ts: Date.now() });
      window.location.hash = id;
      loadPoll(id);
      navigator.clipboard.writeText(window.location.href);
      statusEl.className = 'mt-3 text-xs h-5 text-green-500';
      statusEl.textContent = 'Poll created! Link copied.';
    };

    function loadPoll(id) {
      currentPollId = id;
      document.getElementById('create-view').classList.add('hidden');
      document.getElementById('poll-view').classList.remove('hidden');

      onValue(ref(db, `polls/${id}`), (snapshot) => {
        const data = snapshot.val();
        if (!data) { statusEl.textContent = 'Poll not found'; return; }

        document.getElementById('poll-question').textContent = data.question;
        const voted = localStorage.getItem(`poll-voted-${id}`);
        const total = Object.values(data.votes || {}).reduce((a, b) => a + b, 0);

        document.getElementById('poll-options').innerHTML = data.options.map((opt, i) => {
          const count = (data.votes && data.votes[i]) || 0;
          const pct = total > 0 ? Math.round((count / total) * 100) : 0;
          const color = barColors[i % barColors.length];

          if (voted) {
            return `<div class="relative overflow-hidden rounded-xl border ${voted == i ? 'border-blue-400 dark:border-blue-600' : 'border-gray-200 dark:border-gray-800'} p-3">
              <div class="absolute inset-0 ${color} opacity-10" style="width:${pct}%"></div>
              <div class="relative flex items-center justify-between">
                <span class="text-sm font-medium">${opt} ${voted == i ? '✓' : ''}</span>
                <span class="text-xs font-mono text-gray-500">${count} (${pct}%)</span>
              </div>
            </div>`;
          }
          return `<button onclick="vote(${i})" class="w-full text-left rounded-xl border border-gray-200 dark:border-gray-800 hover:border-blue-400 dark:hover:border-blue-600 p-3 transition-colors">
            <span class="text-sm font-medium">${opt}</span>
          </button>`;
        }).join('');

        document.getElementById('total-votes').textContent = `${total} vote${total !== 1 ? 's' : ''}`;
      });
    }

    window.vote = async function(optionIdx) {
      if (!currentPollId) return;
      const voted = localStorage.getItem(`poll-voted-${currentPollId}`);
      if (voted !== null) return;

      await runTransaction(ref(db, `polls/${currentPollId}/votes/${optionIdx}`), (current) => (current || 0) + 1);
      localStorage.setItem(`poll-voted-${currentPollId}`, optionIdx);
    };

    window.copyPollLink = function() {
      navigator.clipboard.writeText(window.location.href);
      statusEl.className = 'mt-3 text-xs h-5 text-gray-400';
      statusEl.textContent = 'Link copied!';
    };

    window.newPoll = function() {
      window.location.hash = '';
      document.getElementById('create-view').classList.remove('hidden');
      document.getElementById('poll-view').classList.add('hidden');
    };

    // Auto-load from hash
    const hash = window.location.hash.slice(1);
    if (hash) loadPoll(hash);
  </script>
</body>
</html>
