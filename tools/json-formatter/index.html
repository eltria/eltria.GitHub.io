<!DOCTYPE html>
<html lang="zh-cn" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Formatter — Eltria</title>
  <meta name="description" content="Format, validate, minify, and explore JSON online.">
  <script src="/assets/js/theme.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="/assets/css/global.css">
</head>
<body class="bg-white dark:bg-gray-950 text-gray-800 dark:text-gray-200 antialiased">

  <script type="module">
    import { initNav } from '/assets/js/nav.js';
    initNav();
  </script>

  <div class="max-w-5xl mx-auto px-6 py-16">
    <div class="mb-6">
      <a href="/tools/" class="text-xs text-gray-400 hover:text-blue-500 no-underline">← Tools</a>
    </div>
    <h1 class="text-2xl font-bold mb-6">JSON Formatter</h1>

    <!-- Controls -->
    <div class="flex flex-wrap gap-2 mb-4">
      <button onclick="formatJSON()" class="px-3 py-1.5 text-xs font-medium bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">Format</button>
      <button onclick="minifyJSON()" class="px-3 py-1.5 text-xs font-medium bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">Minify</button>
      <button onclick="validateJSON()" class="px-3 py-1.5 text-xs font-medium bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">Validate</button>
      <button onclick="copyOutput()" class="px-3 py-1.5 text-xs font-medium bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">Copy</button>
      <button onclick="clearAll()" class="px-3 py-1.5 text-xs font-medium bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">Clear</button>
      <label class="flex items-center gap-1.5 ml-auto text-xs text-gray-500">
        Indent:
        <select id="indent" class="bg-gray-100 dark:bg-gray-800 border-0 rounded px-2 py-1 text-xs">
          <option value="2" selected>2 spaces</option>
          <option value="4">4 spaces</option>
          <option value="tab">Tab</option>
        </select>
      </label>
    </div>

    <!-- Editor -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-medium text-gray-400 mb-2">Input</label>
        <textarea id="input" class="tool-textarea w-full h-96 p-4 text-sm bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500" placeholder="Paste JSON here..." spellcheck="false"></textarea>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-400 mb-2">Output</label>
        <textarea id="output" class="tool-textarea w-full h-96 p-4 text-sm bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl focus:outline-none" readonly spellcheck="false"></textarea>
      </div>
    </div>

    <!-- Status -->
    <div id="status" class="mt-3 text-xs h-5"></div>

    <!-- Tree View -->
    <div class="mt-8">
      <button onclick="toggleTree()" class="text-xs font-medium text-gray-500 hover:text-blue-500 transition-colors mb-3">Toggle Tree View</button>
      <div id="tree" class="hidden bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl p-4 text-sm font-mono overflow-auto max-h-96"></div>
    </div>
  </div>

  <script>
    const input = document.getElementById('input');
    const output = document.getElementById('output');
    const status = document.getElementById('status');

    function getIndent() {
      const val = document.getElementById('indent').value;
      return val === 'tab' ? '\t' : parseInt(val);
    }

    function setStatus(msg, type) {
      const colors = { ok: 'text-green-500', err: 'text-red-500', info: 'text-gray-400' };
      status.className = `mt-3 text-xs h-5 ${colors[type] || ''}`;
      status.textContent = msg;
    }

    function formatJSON() {
      try {
        const obj = JSON.parse(input.value);
        output.value = JSON.stringify(obj, null, getIndent());
        setStatus(`Valid JSON — ${Object.keys(obj).length} top-level keys`, 'ok');
      } catch (e) {
        setStatus(`Error: ${e.message}`, 'err');
      }
    }

    function minifyJSON() {
      try {
        output.value = JSON.stringify(JSON.parse(input.value));
        setStatus('Minified', 'ok');
      } catch (e) {
        setStatus(`Error: ${e.message}`, 'err');
      }
    }

    function validateJSON() {
      try {
        JSON.parse(input.value);
        setStatus('Valid JSON', 'ok');
      } catch (e) {
        setStatus(`Invalid: ${e.message}`, 'err');
      }
    }

    function copyOutput() {
      navigator.clipboard.writeText(output.value).then(() => setStatus('Copied!', 'info'));
    }

    function clearAll() {
      input.value = '';
      output.value = '';
      document.getElementById('tree').innerHTML = '';
      document.getElementById('tree').classList.add('hidden');
      setStatus('', 'info');
    }

    function toggleTree() {
      const tree = document.getElementById('tree');
      tree.classList.toggle('hidden');
      if (!tree.classList.contains('hidden')) {
        try {
          const obj = JSON.parse(input.value || output.value);
          tree.innerHTML = buildTree(obj);
        } catch (e) {
          tree.innerHTML = `<span class="text-red-500">Cannot parse JSON</span>`;
        }
      }
    }

    function buildTree(obj, depth = 0) {
      if (obj === null) return `<span class="text-gray-400">null</span>`;
      if (typeof obj !== 'object') {
        if (typeof obj === 'string') return `<span class="text-green-600 dark:text-green-400">"${escapeHtml(obj)}"</span>`;
        if (typeof obj === 'number') return `<span class="text-blue-600 dark:text-blue-400">${obj}</span>`;
        if (typeof obj === 'boolean') return `<span class="text-purple-600 dark:text-purple-400">${obj}</span>`;
        return String(obj);
      }
      const isArr = Array.isArray(obj);
      const entries = isArr ? obj.map((v, i) => [i, v]) : Object.entries(obj);
      if (entries.length === 0) return isArr ? '[]' : '{}';
      const pad = '  '.repeat(depth + 1);
      const items = entries.map(([k, v]) => {
        const key = isArr ? `<span class="text-gray-400">[${k}]</span>` : `<span class="text-red-600 dark:text-red-400">"${escapeHtml(String(k))}"</span>`;
        return `${pad}${key}: ${buildTree(v, depth + 1)}`;
      }).join('\n');
      return `${isArr ? '[' : '{'}\n${items}\n${'  '.repeat(depth)}${isArr ? ']' : '}'}`;
    }

    function escapeHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // Auto-format on paste
    input.addEventListener('paste', () => {
      setTimeout(formatJSON, 50);
    });
  </script>
</body>
</html>
