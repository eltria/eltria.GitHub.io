<!DOCTYPE html>
<html lang="zh-cn" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JWT Decoder — Eltria</title>
  <meta name="description" content="Decode and inspect JWT tokens — header, payload, signature, and expiry.">
  <script src="/assets/js/theme.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="/assets/css/global.css">
</head>
<body class="bg-white dark:bg-gray-950 text-gray-800 dark:text-gray-200 antialiased">

  <script type="module">
    import { initNav } from '/assets/js/nav.js';
    initNav();
  </script>

  <div class="max-w-4xl mx-auto px-6 py-16">
    <div class="mb-6">
      <a href="/tools/" class="text-xs text-gray-400 hover:text-blue-500 no-underline">← Tools</a>
    </div>
    <h1 class="text-2xl font-bold mb-6">JWT Decoder</h1>

    <!-- Input -->
    <div class="mb-6">
      <label class="block text-xs font-medium text-gray-400 mb-2">JWT Token</label>
      <textarea id="jwt-input" class="tool-textarea w-full h-32 p-4 text-sm bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500" placeholder="Paste JWT token here (eyJhbG...)..." spellcheck="false"></textarea>
    </div>

    <!-- Decoded parts -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-6">
      <div>
        <label class="block text-xs font-medium text-red-400 mb-2">Header</label>
        <pre id="header" class="w-full min-h-[8rem] p-4 text-sm bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl font-mono whitespace-pre-wrap overflow-auto"></pre>
      </div>
      <div>
        <label class="block text-xs font-medium text-purple-400 mb-2">Payload</label>
        <pre id="payload" class="w-full min-h-[8rem] p-4 text-sm bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl font-mono whitespace-pre-wrap overflow-auto"></pre>
      </div>
    </div>

    <!-- Signature -->
    <div class="mb-6">
      <label class="block text-xs font-medium text-blue-400 mb-2">Signature</label>
      <div id="signature" class="p-4 text-sm bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl font-mono break-all"></div>
    </div>

    <!-- Token status -->
    <div id="token-status" class="space-y-2"></div>

    <!-- Error -->
    <div id="error" class="mt-3 text-xs text-red-500"></div>
  </div>

  <script>
    const input = document.getElementById('jwt-input');
    const headerEl = document.getElementById('header');
    const payloadEl = document.getElementById('payload');
    const signatureEl = document.getElementById('signature');
    const tokenStatus = document.getElementById('token-status');
    const errorEl = document.getElementById('error');

    function b64decode(str) {
      // Handle URL-safe base64
      str = str.replace(/-/g, '+').replace(/_/g, '/');
      // Pad if needed
      while (str.length % 4) str += '=';
      return decodeURIComponent(escape(atob(str)));
    }

    function decode() {
      const jwt = input.value.trim();
      headerEl.textContent = '';
      payloadEl.textContent = '';
      signatureEl.textContent = '';
      tokenStatus.innerHTML = '';
      errorEl.textContent = '';

      if (!jwt) return;

      const parts = jwt.split('.');
      if (parts.length !== 3) {
        errorEl.textContent = 'Invalid JWT: expected 3 parts separated by dots, got ' + parts.length;
        return;
      }

      try {
        const header = JSON.parse(b64decode(parts[0]));
        headerEl.textContent = JSON.stringify(header, null, 2);
      } catch (e) {
        errorEl.textContent = 'Failed to decode header: ' + e.message;
        return;
      }

      try {
        const payload = JSON.parse(b64decode(parts[1]));
        payloadEl.textContent = JSON.stringify(payload, null, 2);

        // Token status checks
        const items = [];

        if (payload.exp) {
          const expDate = new Date(payload.exp * 1000);
          const now = Date.now();
          const expired = now > payload.exp * 1000;
          items.push(`
            <div class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm ${expired ? 'bg-red-50 dark:bg-red-950/30 text-red-600 dark:text-red-400' : 'bg-green-50 dark:bg-green-950/30 text-green-600 dark:text-green-400'}">
              <span class="font-medium">${expired ? 'EXPIRED' : 'VALID'}</span>
              <span class="text-xs opacity-75">exp: ${expDate.toISOString()} (${expired ? 'expired' : 'expires'} ${relativeTime(expDate)})</span>
            </div>
          `);
        }

        if (payload.iat) {
          const iatDate = new Date(payload.iat * 1000);
          items.push(`<div class="text-xs text-gray-500 px-4">Issued: ${iatDate.toISOString()} (${relativeTime(iatDate)})</div>`);
        }

        if (payload.iss) {
          items.push(`<div class="text-xs text-gray-500 px-4">Issuer: ${payload.iss}</div>`);
        }

        if (payload.sub) {
          items.push(`<div class="text-xs text-gray-500 px-4">Subject: ${payload.sub}</div>`);
        }

        if (payload.aud) {
          items.push(`<div class="text-xs text-gray-500 px-4">Audience: ${Array.isArray(payload.aud) ? payload.aud.join(', ') : payload.aud}</div>`);
        }

        tokenStatus.innerHTML = items.join('');
      } catch (e) {
        errorEl.textContent = 'Failed to decode payload: ' + e.message;
        return;
      }

      signatureEl.textContent = parts[2];
    }

    function relativeTime(d) {
      const diff = (Date.now() - d.getTime()) / 1000;
      const abs = Math.abs(diff);
      const suffix = diff > 0 ? 'ago' : 'from now';
      if (abs < 60) return `${Math.floor(abs)}s ${suffix}`;
      if (abs < 3600) return `${Math.floor(abs / 60)}m ${suffix}`;
      if (abs < 86400) return `${Math.floor(abs / 3600)}h ${suffix}`;
      return `${Math.floor(abs / 86400)}d ${suffix}`;
    }

    input.addEventListener('input', decode);
    input.addEventListener('paste', () => setTimeout(decode, 50));
  </script>
</body>
</html>
