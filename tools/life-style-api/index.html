    const PASS_HASH = '4c10cf42edcc563079f07288eafa6395f357cf07620067b8f43ef325a2b282b8';

    async function sha256(text) {
      const data = new TextEncoder().encode(text);
      const hash = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function checkAuth() {
      if (sessionStorage.getItem('ls-api-auth') === 'ok') {
        showApp();
        return;
      }
      document.getElementById('auth-gate').classList.remove('hidden');
    }

    async function tryAuth() {
      const pw = document.getElementById('auth-password').value;
      const hash = await sha256(pw);
      if (hash === PASS_HASH) {
        sessionStorage.setItem('ls-api-auth', 'ok');
        showApp();
      } else {
        document.getElementById('auth-error').classList.remove('hidden');
        document.getElementById('auth-password').value = '';
        document.getElementById('auth-password').focus();
      }
    }

    function showApp() {
      document.getElementById('auth-gate').classList.add('hidden');
      document.getElementById('main-app').classList.remove('hidden');
      initApp();
    }

    document.getElementById('auth-submit').addEventListener('click', tryAuth);
    document.getElementById('auth-password').addEventListener('keydown', e => {
      if (e.key === 'Enter') tryAuth();
    });

    // ─── App Logic ───
    let currentEndpoint = null;

    function initApp() {
      // Restore settings
      const savedUrl = localStorage.getItem('ls-api-base-url');
      const savedToken = localStorage.getItem('ls-api-token');
      if (savedUrl) document.getElementById('base-url-select').value = savedUrl;
      if (savedToken) document.getElementById('bearer-token').value = savedToken;

      // Save on change
      document.getElementById('base-url-select').addEventListener('change', e => localStorage.setItem('ls-api-base-url', e.target.value));
      document.getElementById('bearer-token').addEventListener('input', e => localStorage.setItem('ls-api-token', e.target.value));

      renderSidebar();
      document.getElementById('send-btn').addEventListener('click', sendRequest);
    }

    function renderSidebar() {
      const list = document.getElementById('endpoints-list');
      const modules = {};
      ENDPOINTS.forEach((ep, idx) => {
        if (!modules[ep.module]) modules[ep.module] = [];
        modules[ep.module].push({ ...ep, idx });
      });

      let html = '';
      for (const [mod, eps] of Object.entries(modules)) {
        html += `<div class="module-group">
          <button class="w-full flex items-center justify-between px-3 py-2 text-xs font-semibold text-gray-500 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-900 transition-colors" onclick="toggleModule(this)">
            <span>${mod}</span>
            <svg class="w-3 h-3 transform transition-transform rotate-0 module-arrow" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
          </button>
          <div class="module-endpoints hidden">`;
        for (const ep of eps) {
          html += `<div class="endpoint-item flex items-center gap-2 px-3 py-1.5 text-xs" data-idx="${ep.idx}" onclick="selectEndpoint(${ep.idx})">
            <span class="method-badge ${ep.method.toLowerCase()}">${ep.method}</span>
            <span class="text-gray-600 dark:text-gray-400 truncate">${ep.name}</span>
          </div>`;
        }
        html += `</div></div>`;
      }
      list.innerHTML = html;
    }

    window.toggleModule = function(btn) {
      const eps = btn.nextElementSibling;
      const arrow = btn.querySelector('.module-arrow');
      eps.classList.toggle('hidden');
      arrow.classList.toggle('rotate-180');
    };

    window.selectEndpoint = function(idx) {
      currentEndpoint = ENDPOINTS[idx];

      // Update active state
      document.querySelectorAll('.endpoint-item').forEach(el => el.classList.remove('active'));
      document.querySelector(`[data-idx="${idx}"]`)?.classList.add('active');

      // Show detail
      document.getElementById('empty-state').classList.add('hidden');
      const detail = document.getElementById('endpoint-detail');
      detail.classList.remove('hidden');

      const ep = currentEndpoint;
      const methodEl = document.getElementById('detail-method');
      methodEl.textContent = ep.method;
      methodEl.className = `method-badge ${ep.method.toLowerCase()}`;
      document.getElementById('detail-path').textContent = `/api/v1${ep.path}`;
      document.getElementById('detail-desc').textContent = ep.desc;

      // Path params
      const pathParams = (ep.path.match(/:(\w+)/g) || []).map(p => p.slice(1));
      const ppSection = document.getElementById('path-params-section');
      const ppContainer = document.getElementById('path-params');
      if (pathParams.length) {
        ppSection.classList.remove('hidden');
        ppContainer.innerHTML = pathParams.map(p => `
          <div class="flex items-center gap-2">
            <label class="text-xs text-gray-500 w-24 shrink-0 font-mono">:${p}</label>
            <input type="text" class="path-param flex-1 px-2 py-1.5 text-xs bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-lg focus:outline-none" data-param="${p}" placeholder="Enter ${p}">
          </div>
        `).join('');
      } else {
        ppSection.classList.add('hidden');
      }

      // Query params
      const qpSection = document.getElementById('query-params-section');
      const qpContainer = document.getElementById('query-params');
      if (ep.query?.length) {
        qpSection.classList.remove('hidden');
        qpContainer.innerHTML = ep.query.map(q => `
          <div class="flex items-center gap-2">
            <label class="text-xs text-gray-500 w-24 shrink-0 font-mono">${q.name}${q.required ? '*' : ''}</label>
            <input type="text" class="query-param flex-1 px-2 py-1.5 text-xs bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-lg focus:outline-none" data-param="${q.name}" placeholder="${q.desc}">
          </div>
        `).join('');
      } else {
        qpSection.classList.add('hidden');
      }

      // Body
      const bodySection = document.getElementById('body-section');
      if (ep.body !== undefined) {
        bodySection.classList.remove('hidden');
        document.getElementById('body-editor').value = JSON.stringify(ep.body, null, 2);
      } else {
        bodySection.classList.add('hidden');
      }

      // Clear response
      document.getElementById('response-section').classList.add('hidden');
      document.getElementById('response-time').classList.add('hidden');
    };

    function syntaxHighlight(json) {
      if (typeof json !== 'string') json = JSON.stringify(json, null, 2);
      return json
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/("(\\u[\da-fA-F]{4}|\\[^u]|[^\\"])*"(\s*:)?)/g, (match) => {
          if (/:$/.test(match)) return `<span class="json-key">${match}</span>`;
          return `<span class="json-string">${match}</span>`;
        })
        .replace(/\b(-?\d+\.?\d*([eE][+-]?\d+)?)\b/g, '<span class="json-number">$1</span>')
        .replace(/\b(true|false)\b/g, '<span class="json-boolean">$1</span>')
        .replace(/\bnull\b/g, '<span class="json-null">null</span>');
    }

    async function sendRequest() {
      if (!currentEndpoint) return;
      const ep = currentEndpoint;
      const baseUrl = document.getElementById('base-url-select').value;
      const token = document.getElementById('bearer-token').value;

      // Build URL
      let path = ep.path;
      document.querySelectorAll('.path-param').forEach(input => {
        path = path.replace(`:${input.dataset.param}`, encodeURIComponent(input.value));
      });

      // Query params
      const queryParts = [];
      document.querySelectorAll('.query-param').forEach(input => {
        if (input.value) queryParts.push(`${input.dataset.param}=${encodeURIComponent(input.value)}`);
      });
      const queryString = queryParts.length ? '?' + queryParts.join('&') : '';
      const url = `${baseUrl}${path}${queryString}`;

      // Headers
      const headers = {};
      if (token) headers['Authorization'] = `Bearer ${token}`;

      // Body
      const options = { method: ep.method, headers };
      if (ep.body !== undefined && ['POST', 'PUT', 'PATCH'].includes(ep.method)) {
        headers['Content-Type'] = 'application/json';
        options.body = document.getElementById('body-editor').value;
      }

      // Send
      const btn = document.getElementById('send-btn');
      btn.disabled = true;
      btn.textContent = 'Sending...';

      const start = performance.now();
      try {
        const res = await fetch(url, options);
        const elapsed = Math.round(performance.now() - start);

        let data;
        const contentType = res.headers.get('content-type') || '';
        if (contentType.includes('json')) {
          data = await res.json();
        } else {
          data = await res.text();
        }

        // Show response
        document.getElementById('response-section').classList.remove('hidden');
        const statusEl = document.getElementById('response-status');
        statusEl.textContent = `${res.status} ${res.statusText}`;
        statusEl.className = `text-xs font-mono px-2 py-0.5 rounded ${res.ok ? 'bg-green-100 dark:bg-green-900/30 text-green-700 dark:text-green-400' : 'bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-400'}`;

        const timeEl = document.getElementById('response-time');
        timeEl.textContent = `${elapsed}ms`;
        timeEl.classList.remove('hidden');

        const bodyEl = document.getElementById('response-body');
        if (typeof data === 'object') {
          bodyEl.innerHTML = syntaxHighlight(data);
        } else {
          bodyEl.textContent = data;
        }
      } catch (err) {
        document.getElementById('response-section').classList.remove('hidden');
        const statusEl = document.getElementById('response-status');
        statusEl.textContent = 'Error';
        statusEl.className = 'text-xs font-mono px-2 py-0.5 rounded bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-400';
        document.getElementById('response-body').textContent = err.message;
        document.getElementById('response-time').classList.add('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send Request';
      }
    }

    // Init
    checkAuth();
  </script>
