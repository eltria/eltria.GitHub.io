<!DOCTYPE html>
<html lang="zh-cn" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life-Style — Eltria</title>
  <script src="/assets/js/theme.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class'}</script>
  <link rel="stylesheet" href="/assets/css/global.css">
  <style>
    :root{--sidebar-w:64px}
    .sidebar-icon{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:12px;font-size:18px;cursor:pointer;transition:all .15s}
    .sidebar-icon:hover{background:rgba(59,130,246,.12)}
    .sidebar-icon.active{background:rgba(59,130,246,.18);box-shadow:inset 3px 0 0 #3b82f6}
    .card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:16px;padding:20px;transition:box-shadow .2s}
    .card:hover{box-shadow:0 2px 12px rgba(0,0,0,.06)}
    html{--card-bg:#fff;--card-border:#e5e7eb}
    html.dark{--card-bg:#111827;--card-border:#1f2937}
    .pri-0{border-left:3px solid #94a3b8}.pri-1{border-left:3px solid #3b82f6}.pri-2{border-left:3px solid #f59e0b}.pri-3{border-left:3px solid #ef4444}
    .badge{font-size:10px;padding:2px 8px;border-radius:9999px;font-weight:600}
    .badge-get{background:#dcfce7;color:#16a34a}.badge-post{background:#dbeafe;color:#2563eb}
    .toast{position:fixed;bottom:24px;right:24px;z-index:9999;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:500;animation:slideUp .3s;max-width:360px}
    .toast-ok{background:#dcfce7;color:#15803d;border:1px solid #bbf7d0}
    .toast-err{background:#fee2e2;color:#b91c1c;border:1px solid #fecaca}
    @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
    .spinner{width:20px;height:20px;border:2px solid rgba(59,130,246,.2);border-top-color:#3b82f6;border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
    @keyframes spin{to{transform:rotate(360deg)}}
    .chat-bubble{max-width:80%;padding:10px 14px;border-radius:16px;font-size:13px;line-height:1.6;white-space:pre-wrap}
    .chat-user{background:#3b82f6;color:#fff;border-bottom-right-radius:4px;margin-left:auto}
    .chat-bot{background:#f3f4f6;color:#1f2937;border-bottom-left-radius:4px}
    .dark .chat-bot{background:#1f2937;color:#e5e7eb}
    .tab-btn{padding:6px 16px;font-size:12px;font-weight:600;border-radius:8px;cursor:pointer;transition:all .15s}
    .tab-btn.active{background:#3b82f6;color:#fff}
    .tab-btn:not(.active){color:#6b7280}
    .tab-btn:not(.active):hover{background:rgba(59,130,246,.08)}
    .input{width:100%;padding:8px 12px;font-size:13px;border-radius:10px;border:1px solid #e5e7eb;background:#f9fafb;outline:none;transition:border-color .15s}
    .input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.1)}
    .dark .input{background:#0f172a;border-color:#1e293b;color:#e2e8f0}
    .btn{padding:8px 16px;font-size:13px;font-weight:600;border-radius:10px;cursor:pointer;transition:all .15s;border:none}
    .btn-primary{background:#3b82f6;color:#fff}.btn-primary:hover{background:#2563eb}
    .btn-danger{background:#ef4444;color:#fff}.btn-danger:hover{background:#dc2626}
    .btn-ghost{background:transparent;color:#6b7280;border:1px solid #e5e7eb}
    .btn-ghost:hover{background:#f3f4f6}.dark .btn-ghost{border-color:#374151}.dark .btn-ghost:hover{background:#1f2937}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:#9ca3af;font-size:14px}
    .weather-card{text-align:center;min-width:100px}
    .modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center}
    .modal{background:var(--card-bg);border:1px solid var(--card-border);border-radius:20px;padding:24px;width:100%;max-width:480px;max-height:80vh;overflow-y:auto}
    .view{display:none}.view.active{display:block}
    .section-title{font-size:14px;font-weight:700;color:#374151;margin-bottom:12px}
    .dark .section-title{color:#d1d5db}
    #main-app{height:calc(100vh - 48px)}
    .content-area{flex:1;overflow-y:auto;padding:24px}
    .stat-card{text-align:center}.stat-card .stat-num{font-size:28px;font-weight:800;color:#3b82f6}
    .stat-card .stat-label{font-size:11px;color:#9ca3af;margin-top:2px}
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-800 dark:text-gray-200 antialiased overflow-hidden">
<script type="module">import{initNav}from'/assets/js/nav.js';initNav();</script>

<!-- ═══ Password Gate ═══ -->
<div id="auth-gate" class="min-h-screen flex items-center justify-center">
  <div class="w-full max-w-xs px-6 text-center">
    <div class="text-3xl mb-2">🏠</div>
    <h1 class="text-lg font-bold mb-1">Life-Style</h1>
    <p class="text-xs text-gray-400 mb-6">Enter password to continue</p>
    <div class="flex gap-2">
      <input id="auth-pw" type="password" class="input flex-1" placeholder="Password" autofocus>
      <button onclick="tryAuth()" class="btn btn-primary">Enter</button>
    </div>
    <p id="auth-err" class="text-xs text-red-500 mt-2 hidden">Incorrect password</p>
  </div>
</div>

<!-- ═══ Main App ═══ -->
<div id="main-app" class="hidden flex">
  <!-- Sidebar -->
  <div class="shrink-0 flex flex-col items-center py-3 gap-1 border-r border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900" style="width:var(--sidebar-w)">

    <div class="sidebar-icon" data-view="todo" title="Todo">✅</div>

    <div class="sidebar-icon" data-view="layeros" title="LayerOS">🌤</div>
    <div class="sidebar-icon" data-view="wardrobe" title="Wardrobe">👔</div>
    <div class="sidebar-icon" data-view="billsplit" title="BillSplit">💰</div>
    <div class="sidebar-icon" data-view="foodmap" title="FoodMap">🍜</div>

  </div>

  <!-- Content -->
  <div class="flex-1 flex flex-col min-w-0">
    <!-- Top bar -->
    <div class="shrink-0 flex items-center justify-between px-6 py-2 border-b border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900">

    <!-- Views -->

          <div class="card" id="dash-outfit"><div class="section-title">👔 穿搭建议</div><div class="text-xs text-gray-400">Loading...</div></div>
          <div class="card" id="dash-todos"><div class="section-title">✅ 今日待办</div><div class="text-xs text-gray-400">Loading...</div></div>

        <!-- Chat -->
        <div id="k-chat" class="hidden">

            <div class="w-48 shrink-0 space-y-2 overflow-y-auto">
              <button onclick="chatNewSession()" class="btn btn-primary w-full text-xs mb-2">+ 新对话</button>
              <div id="chat-sessions"></div>

        <!-- Weather -->

          <div class="section-title mb-0">服装管理</div>

        </div>
        <div id="gear-list"></div>

      <!-- ═══ Wardrobe ═══ -->

            <div class="section-title mb-0">衣柜管理</div>

      <!-- ═══ BillSplit ═══ -->

      <!-- ═══ Settings ═══ -->
      <div id="v-settings" class="view">
        <div class="max-w-xl space-y-6">

            <div class="section-title">应用配置</div>
            <div class="space-y-3" id="cfg-app"></div>

<!-- ═══ Modal container ═══ -->
<div id="modal" class="modal-overlay hidden" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-body"></div>
</div>

<!-- ═══ Toast container ═══ -->
<div id="toast-container"></div>

<script>
// ══════════════════════════════════════
//  Auth
// ══════════════════════════════════════
const HASH='4c10cf42edcc563079f07288eafa6395f357cf07620067b8f43ef325a2b282b8';
async function sha256(t){const d=new TextEncoder().encode(t);const h=await crypto.subtle.digest('SHA-256',d);return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('')}
window.tryAuth=async function(){
  const pw=document.getElementById('auth-pw').value;
  if(await sha256(pw)===HASH){sessionStorage.setItem('ls-auth','ok');boot()}
  else{document.getElementById('auth-err').classList.remove('hidden');document.getElementById('auth-pw').value='';document.getElementById('auth-pw').focus()}
};
document.getElementById('auth-pw').addEventListener('keydown',e=>{if(e.key==='Enter')tryAuth()});
if(sessionStorage.getItem('ls-auth')==='ok')boot();

// ══════════════════════════════════════
//  API Client
// ══════════════════════════════════════
function apiUrl(){return document.getElementById('cfg-url').value}
function apiToken(){return document.getElementById('cfg-token').value}
async function api(method,path,body){
  const h={'Authorization':`Bearer ${apiToken()}`};
  const opts={method,headers:h};
  if(body!==undefined){h['Content-Type']='application/json';opts.body=JSON.stringify(body)}
  const r=await fetch(`${apiUrl()}${path}`,opts);
  const j=await r.json().catch(()=>null);
  if(!r.ok)throw new Error(j?.message||`HTTP ${r.status}`);
  return j?.data;
}
const GET=(p)=>api('GET',p);
const POST=(p,b)=>api('POST',p,b);
const PUT=(p,b)=>api('PUT',p,b);
const DEL=(p)=>api('DELETE',p);
const PATCH=(p,b)=>api('PATCH',p,b);

// ══════════════════════════════════════
//  Utilities
// ══════════════════════════════════════
function toast(msg,ok=true){
  const el=document.createElement('div');
  el.className=`toast ${ok?'toast-ok':'toast-err'}`;
  el.textContent=msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(()=>el.remove(),3000);
}
function showModal(html){document.getElementById('modal-body').innerHTML=html;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function fmtDate(d){if(!d)return'';return new Date(d).toLocaleDateString('zh-CN',{month:'short',day:'numeric'})}
function fmtDateTime(d){if(!d)return'';return new Date(d).toLocaleString('zh-CN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}
const PRI_LABELS=['低','中','高','紧急'];
const PRI_COLORS=['#94a3b8','#3b82f6','#f59e0b','#ef4444'];
const STATUS_LABELS=['待处理','进行中','已完成','已归档'];
function loading(id){document.getElementById(id).innerHTML='<div class="flex justify-center py-8"><div class="spinner"></div></div>'}
function empty(id,msg='暂无数据'){document.getElementById(id).innerHTML=`<div class="empty-state">${msg}</div>`}

// ══════════════════════════════════════
//  Router
// ══════════════════════════════════════
const VIEWS={dashboard:'Dashboard',todo:'Todo',knowledge:'Knowledge',layeros:'LayerOS',wardrobe:'Wardrobe',billsplit:'BillSplit',foodmap:'FoodMap',settings:'Settings'};
let currentView='dashboard';

function navigate(v){
  currentView=v;
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.getElementById(`v-${v}`).classList.add('active');
  document.querySelectorAll('.sidebar-icon').forEach(el=>{el.classList.toggle('active',el.dataset.view===v)});
  document.getElementById('view-title').textContent=VIEWS[v];
  // init view
  const inits={dashboard:initDashboard,todo:initTodo,knowledge:initKnowledge,layeros:initLayerOS,wardrobe:initWardrobe,billsplit:initBillSplit,foodmap:initFoodMap,settings:initSettings};
  inits[v]?.();
}

document.querySelectorAll('.sidebar-icon').forEach(el=>{
  el.addEventListener('click',()=>navigate(el.dataset.view));
});

// Tab helpers
function initTabs(sel,cb){
  document.querySelectorAll(sel).forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll(sel).forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      cb(btn.dataset.tf||btn.dataset.kt||btn.dataset.bt||btn.dataset.ft);
    });
  });
}

// ══════════════════════════════════════
//  Dashboard
// ══════════════════════════════════════
async function initDashboard(){
  // Token warning
  const warn=document.getElementById('dash-token-warn');
  warn.classList.toggle('hidden',!!apiToken());

  const el=document.getElementById('dash-stats');
  if(!apiToken()){
    el.innerHTML=[{n:'—',l:'待处理待办'},{n:'—',l:'知识条目'},{n:'—',l:'衣物数量'},{n:'—',l:'商场数量'}].map(s=>`<div class="card stat-card"><div class="stat-num">${s.n}</div><div class="stat-label">${s.l}</div></div>`).join('');
    document.getElementById('dash-weather').innerHTML='<div class="section-title">🌤 今日天气</div><div class="text-xs text-gray-400">请先配置 Token</div>';

window.chatSend=async function(){
  const input=document.getElementById('chat-input');const q=input.value.trim();if(!q)return;
  // Show user message
  const msgs=document.getElementById('chat-messages');
  msgs.innerHTML+=`<div class="flex justify-end"><div class="chat-bubble chat-user">${q}</div></div>`;
  msgs.innerHTML+=`<div class="flex justify-start"><div class="chat-bubble chat-bot"><div class="spinner" style="width:14px;height:14px"></div></div></div>`;
  msgs.scrollTop=99999;input.value='';
  try{
    const d=await POST(`/knowledge/chat/sessions/${chatSessionId}/ask`,{question:q});
    if(d.isNewSession||chatSessionId===0){chatSessionId=d.sessionId;loadChatSessions()}
    // Replace spinner with response
    const bubbles=msgs.querySelectorAll('.chat-bot');
    const last=bubbles[bubbles.length-1];
    last.textContent=d.message;
    if(d.referencedKnowledge?.length){
      last.innerHTML+=`<div class="mt-2 pt-2 border-t border-gray-300 dark:border-gray-600 text-xs text-gray-500">参考: ${d.referencedKnowledge.map(k=>k.title).join(', ')}</div>`;
    }
    msgs.scrollTop=99999;
  }catch(e){toast(e.message,false);const bubbles=msgs.querySelectorAll('.chat-bot');bubbles[bubbles.length-1].textContent='发送失败: '+e.message}
};

    `;
  }catch(e){
    document.getElementById('cfg-claude').innerHTML=`<div class="text-xs text-red-500">${e.message}</div>`;
    document.getElementById('cfg-embedding').innerHTML='';
  }

  // LLM
  try{
    const l=await GET('/llm/status');
    document.getElementById('cfg-llm').innerHTML=`
      <div class="space-y-3">
        <div class="flex items-center justify-between">
          <div><div class="text-sm font-medium">主模型: ${l.primary?.name||'—'}</div><div class="text-xs text-gray-400">${l.primary?.model||''} · ${l.primary?.configured?'已配置':'未配置'}</div></div>
          <button onclick="llmProbe()" class="btn btn-ghost text-xs">探测</button>
        </div>
        <div class="text-xs">熔断器: <span class="${l.circuitBreaker?.state==='closed'?'text-green-500':'text-red-500'}">${l.circuitBreaker?.state||'—'}</span> · 失败次数: ${l.circuitBreaker?.failCount||0}</div>
        ${l.fallbacks?.length?`<div class="section-title text-xs mt-2">Fallback Providers</div>`+l.fallbacks.map(f=>`<div class="flex items-center justify-between py-1 border-t border-gray-100 dark:border-gray-800"><div class="text-xs"><span class="font-medium">${f.name}</span> · ${f.model}</div><button onclick="llmProbeOne('${f.name}')" class="text-xs text-blue-500 hover:underline">探测</button></div>`).join(''):''}
      </div>
    `;
  }catch(e){document.getElementById('cfg-llm').innerHTML=`<div class="text-xs text-red-500">${e.message}</div>`}
}

window.llmProbe=async function(){try{const d=await POST('/llm/probe');toast(`探测${d?.ok?'成功':'失败'} · ${d?.latency_ms||0}ms`)}catch(e){toast(e.message,false)}};
window.llmProbeOne=async function(name){try{const d=await POST(`/llm/probe/${name}`);toast(`${name}: ${d?.ok?'成功':'失败'} · ${d?.latency_ms||0}ms`)}catch(e){toast(e.message,false)}};

// ══════════════════════════════════════
//  Boot
// ══════════════════════════════════════
function boot(){
  document.getElementById('auth-gate').classList.add('hidden');
  document.getElementById('main-app').classList.remove('hidden');
  // Restore settings
  const u=localStorage.getItem('ls-url');if(u)document.getElementById('cfg-url').value=u;
  const t=localStorage.getItem('ls-token');if(t)document.getElementById('cfg-token').value=t;
  document.getElementById('cfg-url').addEventListener('change',e=>localStorage.setItem('ls-url',e.target.value));
  document.getElementById('cfg-token').addEventListener('input',e=>{localStorage.setItem('ls-token',e.target.value)});
  // Refresh on token change (debounced)
  let tokenTimer;
  document.getElementById('cfg-token').addEventListener('change',()=>{clearTimeout(tokenTimer);tokenTimer=setTimeout(()=>{if(currentView==='dashboard')initDashboard()},300)});
  navigate('dashboard');
}
</script>
</body>
</html>
