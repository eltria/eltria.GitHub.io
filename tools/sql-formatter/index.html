<!DOCTYPE html>
<html lang="zh-cn" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQL Formatter — Eltria</title>
  <meta name="description" content="Format and beautify SQL queries online.">
  <script src="/assets/js/theme.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="/assets/css/global.css">
  <script src="https://cdn.jsdelivr.net/npm/sql-formatter@15.3.1/dist/sql-formatter.min.js"></script>
</head>
<body class="bg-white dark:bg-gray-950 text-gray-800 dark:text-gray-200 antialiased">
  <script type="module">import { initNav } from '/assets/js/nav.js'; initNav();</script>

  <div class="max-w-5xl mx-auto px-6 py-16">
    <div class="mb-6"><a href="/tools/" class="text-xs text-gray-400 hover:text-blue-500 no-underline">← Tools</a></div>
    <h1 class="text-2xl font-bold mb-6">SQL Formatter</h1>

    <div class="flex flex-wrap gap-2 mb-4">
      <button onclick="formatSQL()" class="px-3 py-1.5 text-xs font-medium bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">Format</button>
      <button onclick="minifySQL()" class="px-3 py-1.5 text-xs font-medium bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">Minify</button>
      <button onclick="copyOutput()" class="px-3 py-1.5 text-xs font-medium bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">Copy</button>
      <button onclick="clearAll()" class="px-3 py-1.5 text-xs font-medium bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">Clear</button>
      <label class="flex items-center gap-1.5 ml-auto text-xs text-gray-500">
        Dialect:
        <select id="dialect" class="bg-gray-100 dark:bg-gray-800 border-0 rounded px-2 py-1 text-xs">
          <option value="sql">Standard SQL</option>
          <option value="mysql">MySQL</option>
          <option value="postgresql">PostgreSQL</option>
          <option value="sqlite">SQLite</option>
          <option value="bigquery">BigQuery</option>
          <option value="plsql">PL/SQL</option>
        </select>
      </label>
      <label class="flex items-center gap-1.5 text-xs text-gray-500">
        Indent:
        <select id="indent" class="bg-gray-100 dark:bg-gray-800 border-0 rounded px-2 py-1 text-xs">
          <option value="2">2 spaces</option>
          <option value="4">4 spaces</option>
          <option value="tab">Tab</option>
        </select>
      </label>
      <label class="flex items-center gap-1.5 text-xs text-gray-500">
        <input type="checkbox" id="uppercase" checked class="rounded"> UPPERCASE
      </label>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-medium text-gray-400 mb-2">Input</label>
        <textarea id="input" class="tool-textarea w-full h-96 p-4 text-sm bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500" placeholder="Paste SQL here..." spellcheck="false">select u.id, u.name, o.total from users u inner join orders o on u.id = o.user_id where o.created_at >= '2024-01-01' and u.status = 'active' order by o.total desc limit 10;</textarea>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-400 mb-2">Output</label>
        <textarea id="output" class="tool-textarea w-full h-96 p-4 text-sm bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl focus:outline-none" readonly spellcheck="false"></textarea>
      </div>
    </div>
    <div id="status" class="mt-3 text-xs h-5"></div>
  </div>

  <script>
    const input = document.getElementById('input');
    const output = document.getElementById('output');
    const status = document.getElementById('status');

    function getOptions() {
      const indentVal = document.getElementById('indent').value;
      return {
        language: document.getElementById('dialect').value,
        tabWidth: indentVal === 'tab' ? 1 : parseInt(indentVal),
        useTabs: indentVal === 'tab',
        keywordCase: document.getElementById('uppercase').checked ? 'upper' : 'preserve',
      };
    }

    function formatSQL() {
      try {
        output.value = sqlFormatter.format(input.value, getOptions());
        status.className = 'mt-3 text-xs h-5 text-green-500';
        status.textContent = 'Formatted';
      } catch (e) {
        status.className = 'mt-3 text-xs h-5 text-red-500';
        status.textContent = e.message;
      }
    }

    function minifySQL() {
      output.value = input.value.replace(/\s+/g, ' ').replace(/\s*([,;()])\s*/g, '$1 ').trim();
      status.className = 'mt-3 text-xs h-5 text-green-500';
      status.textContent = 'Minified';
    }

    function copyOutput() {
      navigator.clipboard.writeText(output.value);
      status.className = 'mt-3 text-xs h-5 text-gray-400';
      status.textContent = 'Copied!';
    }

    function clearAll() {
      input.value = ''; output.value = '';
      status.textContent = '';
    }

    input.addEventListener('paste', () => setTimeout(formatSQL, 50));
  </script>
</body>
</html>
