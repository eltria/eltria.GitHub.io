<!DOCTYPE html>
<html lang="zh-cn" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON to Types — Eltria</title>
  <meta name="description" content="Generate TypeScript interfaces, Go structs, and Python dataclasses from JSON.">
  <script src="/assets/js/theme.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="/assets/css/global.css">
</head>
<body class="bg-white dark:bg-gray-950 text-gray-800 dark:text-gray-200 antialiased">
  <script type="module">import { initNav } from '/assets/js/nav.js'; initNav();</script>

  <div class="max-w-5xl mx-auto px-6 py-16">
    <div class="mb-6"><a href="/tools/" class="text-xs text-gray-400 hover:text-blue-500 no-underline">← Tools</a></div>
    <h1 class="text-2xl font-bold mb-6">JSON to Types</h1>

    <div class="flex flex-wrap gap-2 mb-4">
      <button onclick="convert('ts')" class="lang-btn px-3 py-1.5 text-xs font-medium bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors" data-lang="ts">TypeScript</button>
      <button onclick="convert('go')" class="lang-btn px-3 py-1.5 text-xs font-medium bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors" data-lang="go">Go</button>
      <button onclick="convert('py')" class="lang-btn px-3 py-1.5 text-xs font-medium bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors" data-lang="py">Python</button>
      <button onclick="copyOutput()" class="px-3 py-1.5 text-xs font-medium bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors ml-auto">Copy</button>
      <label class="flex items-center gap-1.5 text-xs text-gray-500">
        Root name:
        <input id="root-name" type="text" value="Root" class="w-20 px-2 py-1 bg-gray-100 dark:bg-gray-800 border-0 rounded text-xs font-mono">
      </label>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-medium text-gray-400 mb-2">JSON Input</label>
        <textarea id="input" class="tool-textarea w-full h-96 p-4 text-sm bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500" placeholder='{"name": "John", "age": 30, "active": true}' spellcheck="false"></textarea>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-400 mb-2">Generated Types</label>
        <textarea id="output" class="tool-textarea w-full h-96 p-4 text-sm bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl focus:outline-none" readonly spellcheck="false"></textarea>
      </div>
    </div>
    <div id="status" class="mt-3 text-xs h-5"></div>
  </div>

  <script>
    let currentLang = 'ts';

    function convert(lang) {
      currentLang = lang;
      document.querySelectorAll('.lang-btn').forEach(btn => {
        const active = btn.dataset.lang === lang;
        btn.className = `lang-btn px-3 py-1.5 text-xs font-medium rounded-lg transition-colors ${active ? 'bg-blue-600 text-white hover:bg-blue-700' : 'bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700'}`;
      });
      doConvert();
    }

    function doConvert() {
      const input = document.getElementById('input').value.trim();
      const output = document.getElementById('output');
      const status = document.getElementById('status');
      if (!input) { output.value = ''; return; }
      try {
        const obj = JSON.parse(input);
        const rootName = document.getElementById('root-name').value || 'Root';
        const generators = { ts: toTS, go: toGo, py: toPython };
        output.value = generators[currentLang](obj, rootName);
        status.className = 'mt-3 text-xs h-5 text-green-500';
        status.textContent = 'Generated';
      } catch (e) {
        status.className = 'mt-3 text-xs h-5 text-red-500';
        status.textContent = e.message;
      }
    }

    function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
    function camelToSnake(s) { return s.replace(/([A-Z])/g, '_$1').toLowerCase().replace(/^_/, ''); }

    function inferType(val) {
      if (val === null) return 'null';
      if (Array.isArray(val)) return 'array';
      return typeof val;
    }

    // TypeScript
    function toTS(obj, name, indent = 0) {
      if (typeof obj !== 'object' || obj === null) return '';
      const pad = '  '.repeat(indent);
      let result = `${pad}interface ${name} {\n`;
      const nested = [];
      for (const [key, val] of Object.entries(Array.isArray(obj) ? (obj[0] || {}) : obj)) {
        const type = tsType(key, val, name, nested);
        result += `${pad}  ${key}: ${type};\n`;
      }
      result += `${pad}}\n`;
      for (const n of nested) result += '\n' + n;
      return result;
    }

    function tsType(key, val, parentName, nested) {
      if (val === null) return 'null';
      if (typeof val === 'string') return 'string';
      if (typeof val === 'number') return Number.isInteger(val) ? 'number' : 'number';
      if (typeof val === 'boolean') return 'boolean';
      if (Array.isArray(val)) {
        if (val.length === 0) return 'any[]';
        if (typeof val[0] === 'object' && val[0] !== null) {
          const subName = capitalize(key);
          nested.push(toTS(val[0], subName));
          return `${subName}[]`;
        }
        return `${tsType(key, val[0], parentName, nested)}[]`;
      }
      if (typeof val === 'object') {
        const subName = capitalize(key);
        nested.push(toTS(val, subName));
        return subName;
      }
      return 'any';
    }

    // Go
    function toGo(obj, name) {
      if (typeof obj !== 'object' || obj === null) return '';
      const data = Array.isArray(obj) ? (obj[0] || {}) : obj;
      let result = `type ${name} struct {\n`;
      const nested = [];
      for (const [key, val] of Object.entries(data)) {
        const goKey = capitalize(key);
        const type = goType(key, val, nested);
        result += `\t${goKey} ${type} \`json:"${key}"\`\n`;
      }
      result += `}\n`;
      for (const n of nested) result += '\n' + n;
      return result;
    }

    function goType(key, val, nested) {
      if (val === null) return 'interface{}';
      if (typeof val === 'string') return 'string';
      if (typeof val === 'number') return Number.isInteger(val) ? 'int' : 'float64';
      if (typeof val === 'boolean') return 'bool';
      if (Array.isArray(val)) {
        if (val.length === 0) return '[]interface{}';
        if (typeof val[0] === 'object' && val[0] !== null) {
          const subName = capitalize(key);
          nested.push(toGo(val[0], subName));
          return `[]${subName}`;
        }
        return `[]${goType(key, val[0], nested)}`;
      }
      if (typeof val === 'object') {
        const subName = capitalize(key);
        nested.push(toGo(val, subName));
        return subName;
      }
      return 'interface{}';
    }

    // Python
    function toPython(obj, name) {
      if (typeof obj !== 'object' || obj === null) return '';
      const data = Array.isArray(obj) ? (obj[0] || {}) : obj;
      let result = 'from dataclasses import dataclass\nfrom typing import Optional, List\n\n';
      const nested = [];
      result += pyClass(data, name, nested);
      for (const n of nested) result = n + '\n' + result;
      return result;
    }

    function pyClass(data, name, nested) {
      let result = `@dataclass\nclass ${name}:\n`;
      for (const [key, val] of Object.entries(data)) {
        const snakeKey = camelToSnake(key);
        const type = pyType(key, val, nested);
        result += `    ${snakeKey}: ${type}\n`;
      }
      return result;
    }

    function pyType(key, val, nested) {
      if (val === null) return 'Optional[str]';
      if (typeof val === 'string') return 'str';
      if (typeof val === 'number') return Number.isInteger(val) ? 'int' : 'float';
      if (typeof val === 'boolean') return 'bool';
      if (Array.isArray(val)) {
        if (val.length === 0) return 'List';
        if (typeof val[0] === 'object' && val[0] !== null) {
          const subName = capitalize(key);
          nested.push(pyClass(val[0], subName, nested));
          return `List[${subName}]`;
        }
        return `List[${pyType(key, val[0], nested)}]`;
      }
      if (typeof val === 'object') {
        const subName = capitalize(key);
        nested.push(pyClass(val, subName, nested));
        return subName;
      }
      return 'str';
    }

    function copyOutput() {
      navigator.clipboard.writeText(document.getElementById('output').value);
      const s = document.getElementById('status');
      s.className = 'mt-3 text-xs h-5 text-gray-400';
      s.textContent = 'Copied!';
    }

    document.getElementById('input').addEventListener('input', doConvert);
    document.getElementById('input').addEventListener('paste', () => setTimeout(doConvert, 50));
    document.getElementById('root-name').addEventListener('input', doConvert);
  </script>
</body>
</html>
