<!DOCTYPE html>
<html lang="zh-cn" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workspace — Eltria</title>
  <meta name="description" content="Open multiple tools side by side in a tabbed workspace.">
  <script src="/assets/js/theme.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="/assets/css/global.css">
  <style>
    .tab { cursor: pointer; user-select: none; }
    .tab.active { border-bottom-color: #3b82f6; color: #3b82f6; }
    .tab .close { opacity: 0; transition: opacity 0.15s; }
    .tab:hover .close { opacity: 1; }
    .workspace-frame { border: none; width: 100%; height: 100%; }
  </style>
</head>
<body class="bg-white dark:bg-gray-950 text-gray-800 dark:text-gray-200 antialiased overflow-hidden">

  <div class="h-screen flex flex-col">
    <!-- Top bar -->
    <div class="shrink-0 flex items-center justify-between px-4 py-2 border-b border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-gray-900">
      <div class="flex items-center gap-3">
        <a href="/" class="text-sm font-semibold text-gray-800 dark:text-gray-100 hover:text-blue-600 dark:hover:text-blue-400 transition-colors no-underline">Eltria</a>
        <span class="text-gray-300 dark:text-gray-700">|</span>
        <span class="text-xs text-gray-500">Workspace</span>
      </div>
      <div class="flex items-center gap-2">
        <button id="add-tab" class="flex items-center gap-1 px-2.5 py-1 text-xs font-medium bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
          + Add Tool
        </button>
        <select id="layout-mode" class="text-xs bg-gray-100 dark:bg-gray-800 border-0 rounded-lg px-2 py-1">
          <option value="tabs">Tabs</option>
          <option value="split-h">Split Horizontal</option>
          <option value="split-v">Split Vertical</option>
        </select>
      </div>
    </div>

    <!-- Tabs bar -->
    <div id="tabs-bar" class="shrink-0 flex items-center gap-0 px-2 bg-gray-50 dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 overflow-x-auto" style="scrollbar-width:none">
    </div>

    <!-- Frames container -->
    <div id="frames" class="flex-1 min-h-0 relative">
    </div>

    <!-- Tool picker modal -->
    <div id="picker" class="fixed inset-0 z-50 hidden">
      <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" id="picker-backdrop"></div>
      <div class="relative max-w-md w-full mx-auto mt-[15vh] bg-white dark:bg-gray-900 rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-700 overflow-hidden">
        <div class="px-4 py-3 border-b border-gray-100 dark:border-gray-800">
          <input id="picker-search" type="text" class="w-full bg-transparent text-sm focus:outline-none" placeholder="Search tools..." spellcheck="false">
        </div>
        <div id="picker-list" class="max-h-80 overflow-auto py-2"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { TOOLS } from '/assets/js/nav.js';

    const tabsBar = document.getElementById('tabs-bar');
    const frames = document.getElementById('frames');
    const picker = document.getElementById('picker');
    const pickerSearch = document.getElementById('picker-search');
    const pickerList = document.getElementById('picker-list');
    const layoutMode = document.getElementById('layout-mode');

    let tabs = []; // { id, name, icon, path }
    let activeTabId = null;
    let nextId = 1;

    function addTab(tool) {
      const tab = { id: nextId++, name: tool.name, icon: tool.icon, path: tool.path };
      tabs.push(tab);
      activateTab(tab.id);
      renderTabs();
      renderFrames();
      closePicker();
    }

    function closeTab(id) {
      tabs = tabs.filter(t => t.id !== id);
      if (activeTabId === id) {
        activeTabId = tabs.length ? tabs[tabs.length - 1].id : null;
      }
      renderTabs();
      renderFrames();
    }

    function activateTab(id) {
      activeTabId = id;
      renderTabs();
      renderFrames();
    }

    function renderTabs() {
      tabsBar.innerHTML = tabs.map(tab => `
        <div class="tab flex items-center gap-1.5 px-3 py-2 text-xs font-medium border-b-2 transition-colors ${tab.id === activeTabId ? 'active border-blue-500 text-blue-600 dark:text-blue-400' : 'border-transparent text-gray-500 hover:text-gray-700 dark:hover:text-gray-300'}" data-id="${tab.id}">
          <span class="font-mono text-[10px]">${tab.icon}</span>
          <span>${tab.name}</span>
          <button class="close ml-1 text-gray-400 hover:text-red-500 text-[10px]" data-close="${tab.id}">✕</button>
        </div>
      `).join('');

      // Tab click handlers
      tabsBar.querySelectorAll('.tab').forEach(el => {
        el.addEventListener('click', (e) => {
          if (e.target.dataset.close) {
            closeTab(parseInt(e.target.dataset.close));
          } else {
            activateTab(parseInt(el.dataset.id));
          }
        });
      });
    }

    function renderFrames() {
      const mode = layoutMode.value;

      if (mode === 'tabs') {
        frames.className = 'flex-1 min-h-0 relative';
        frames.innerHTML = '';
        tabs.forEach(tab => {
          let iframe = document.getElementById(`frame-${tab.id}`);
          if (!iframe) {
            iframe = document.createElement('iframe');
            iframe.id = `frame-${tab.id}`;
            iframe.className = 'workspace-frame absolute inset-0';
            iframe.src = tab.path;
          }
          iframe.style.display = tab.id === activeTabId ? 'block' : 'none';
          frames.appendChild(iframe);
        });
      } else {
        const dir = mode === 'split-h' ? 'flex-row' : 'flex-col';
        frames.className = `flex-1 min-h-0 flex ${dir}`;
        frames.innerHTML = '';
        tabs.forEach(tab => {
          const wrapper = document.createElement('div');
          wrapper.className = 'flex-1 min-h-0 min-w-0 border border-gray-200 dark:border-gray-800';
          const iframe = document.createElement('iframe');
          iframe.className = 'workspace-frame';
          iframe.src = tab.path;
          wrapper.appendChild(iframe);
          frames.appendChild(wrapper);
        });
      }

      // Empty state
      if (tabs.length === 0) {
        frames.className = 'flex-1 min-h-0 flex items-center justify-center';
        frames.innerHTML = `
          <div class="text-center">
            <p class="text-gray-400 text-sm mb-4">No tools open yet.</p>
            <button id="empty-add" class="px-4 py-2 text-xs font-medium bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">+ Add Tool</button>
          </div>
        `;
        document.getElementById('empty-add')?.addEventListener('click', openPicker);
      }
    }

    // Picker
    function openPicker() {
      picker.classList.remove('hidden');
      pickerSearch.value = '';
      renderPicker();
      pickerSearch.focus();
    }

    function closePicker() {
      picker.classList.add('hidden');
    }

    function renderPicker() {
      const q = pickerSearch.value.toLowerCase().trim();
      const filtered = TOOLS.filter(t => {
        const text = (t.name + ' ' + t.keywords).toLowerCase();
        return !q || q.split(/\s+/).every(w => text.includes(w));
      });
      pickerList.innerHTML = filtered.map((tool, i) => `
        <button class="picker-item flex items-center gap-3 w-full px-4 py-2.5 text-sm text-left hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors" data-idx="${i}">
          <span class="w-7 text-center text-xs font-mono shrink-0">${tool.icon}</span>
          <span class="font-medium text-gray-700 dark:text-gray-300">${tool.name}</span>
        </button>
      `).join('') || '<div class="px-4 py-6 text-center text-sm text-gray-400">No tools found</div>';

      pickerList.querySelectorAll('.picker-item').forEach((el, i) => {
        el.addEventListener('click', () => addTab(filtered[i]));
      });
    }

    // Events
    document.getElementById('add-tab').addEventListener('click', openPicker);
    document.getElementById('picker-backdrop').addEventListener('click', closePicker);
    pickerSearch.addEventListener('input', renderPicker);
    layoutMode.addEventListener('change', renderFrames);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !picker.classList.contains('hidden')) closePicker();
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); openPicker(); }
    });

    // Init
    renderTabs();
    renderFrames();

    // Restore tabs from URL or open picker
    const params = new URLSearchParams(window.location.search);
    const toolsParam = params.get('tools');
    if (toolsParam) {
      toolsParam.split(',').forEach(path => {
        const tool = TOOLS.find(t => t.path.includes(path));
        if (tool) addTab(tool);
      });
    }
  </script>
</body>
</html>
